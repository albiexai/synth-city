name: Backend regression tests

on:
  pull_request:
    branches: [master, feature/software-delivery-product-reposition, release/v3.1, release/v4.0, release/v4.1, release/v4.2, release/v4.3, release/v4.4]
    types: [opened, synchronize, reopened]
  push:
    branches: [master, feature/software-delivery-product-reposition, release/v3.1, release/v4.0, release/v4.1, release/v4.2, release/v4.3, release/v4.4]

permissions:
  contents: read
  pull-requests: read  # the docs-only detector lists the changed files

env:
  BACKEND_SHARDS: '4'   # must equal the length of the shard matrix below (a test checks it)

concurrency:
  group: backend-regressions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The backend suite runs as parallel shards (#1013). A shard runs whole test files chosen by
  # scripts/ci/backend_shards.py. These shard jobs are not required checks; the gate below is.
  backend:
    name: Backend shard ${{ matrix.shard }} of 4   # the env context is not available in a job name; a test checks the 4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect a docs-only change
        id: changes
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/docs_only.py
      - uses: actions/setup-python@v7
        if: steps.changes.outputs.run_suites != 'false'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
        if: steps.changes.outputs.run_suites != 'false'
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.run_suites != 'false'
        with:
          node-version: '24'
      - name: Configure disposable Git fixtures
        if: steps.changes.outputs.run_suites != 'false'
        run: |
          git config --global user.name 'Factory CI'
          git config --global user.email 'factory-ci@users.noreply.github.com'
      - name: Configure synthetic installation settings
        if: steps.changes.outputs.run_suites != 'false'
        run: |
          cat > backend/.env <<'EOF'
          OPERATOR_TOKEN=synthetic-ci-operator
          GITHUB_APP_ID=123
          GITHUB_APP_PRIVATE_KEY_PATH=/synthetic/ci-private-key.pem
          MAIL_CAPABILITY_TOKENS_REQUIRED=true
          DEBUG=invalid
          EOF
      - name: Collect the test identities of this shard
        if: steps.changes.outputs.run_suites != 'false'
        working-directory: backend
        # A collection error makes pytest exit non-zero, so the shard fails here before it runs anything.
        run: |
          python ../scripts/ci/backend_shards.py --shard ${{ matrix.shard }} --of ${{ env.BACKEND_SHARDS }} > backend-shard-files.txt
          python -m pytest $(cat backend-shard-files.txt) --collect-only -q -p no:cacheprovider > backend-shard-collect.txt || { cat backend-shard-collect.txt; exit 1; }
          grep '::' backend-shard-collect.txt > backend-shard-${{ matrix.shard }}-collected.txt
      - name: Run this shard of the backend suite
        if: steps.changes.outputs.run_suites != 'false'
        working-directory: backend
        # The 30 slowest tests go to the log. The JUnit file keeps the time of every test case (#866). The
        # identity plugin records every executed test once, for the partition check of the gate (#1013).
        run: python -m pytest $(cat backend-shard-files.txt) -q --tb=short -p tests.ci_shard_identity --identity-out=backend-shard-${{ matrix.shard }}-executed.jsonl --durations=30 --durations-min=1.0 --junitxml=backend-junit-${{ matrix.shard }}.xml
      - name: Keep the backend test timings and identities
        # Runs after a failed suite too, so a failing run still keeps what pytest wrote.
        if: always() && steps.changes.outputs.run_suites != 'false'
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-timings-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            backend/backend-junit-${{ matrix.shard }}.xml
            backend/backend-shard-${{ matrix.shard }}-collected.txt
            backend/backend-shard-${{ matrix.shard }}-executed.jsonl
          if-no-files-found: error
          retention-days: 14

  # The required check keeps its name and meaning (#1013). It passes only when every shard succeeded and the
  # shards together ran every test of the full collection exactly once.
  backend-gate:
    name: Full backend regression tests
    needs: backend
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/candidate/backend
      DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
    steps:
      - name: Require every shard to succeed
        env:
          SHARDS_RESULT: ${{ needs.backend.result }}
        run: |
          if [ "$SHARDS_RESULT" != "success" ]; then
            echo "The backend shards finished as: $SHARDS_RESULT"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the workflow's gate tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-ci
          sparse-checkout: scripts/ci
          persist-credentials: false
      - name: Detect a docs-only change
        id: changes
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .workflow-ci/scripts/ci/docs_only.py
      - uses: actions/setup-python@v7
        if: steps.changes.outputs.run_suites != 'false'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: candidate/backend/requirements.txt
      - run: python -m pip install -r candidate/backend/requirements.txt
        if: steps.changes.outputs.run_suites != 'false'
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.run_suites != 'false'
        with:
          node-version: '24'
      - name: Configure disposable Git fixtures
        if: steps.changes.outputs.run_suites != 'false'
        run: |
          git config --global user.name 'Factory CI'
          git config --global user.email 'factory-ci@users.noreply.github.com'
      - name: Configure synthetic installation settings
        if: steps.changes.outputs.run_suites != 'false'
        run: |
          cat > candidate/backend/.env <<'EOF'
          OPERATOR_TOKEN=synthetic-ci-operator
          GITHUB_APP_ID=123
          GITHUB_APP_PRIVATE_KEY_PATH=/synthetic/ci-private-key.pem
          MAIL_CAPABILITY_TOKENS_REQUIRED=true
          DEBUG=invalid
          EOF
      - uses: actions/download-artifact@v5
        if: steps.changes.outputs.run_suites != 'false'
        with:
          # Untouched shards can come from earlier attempts of this same run.
          pattern: backend-test-timings-*-attempt-*
          path: ${{ runner.temp }}/backend-shard-artifacts
          merge-multiple: false
      - name: Collect the full backend suite
        if: steps.changes.outputs.run_suites != 'false'
        working-directory: candidate/backend
        run: |
          python -m pytest tests --collect-only -q -p no:cacheprovider --ignore=tests/test_cc_bridge_real_sudo.py > backend-full-collect.txt || { cat backend-full-collect.txt; exit 1; }
          grep '::' backend-full-collect.txt > backend-full-collected.txt
      - name: Prove that the shards ran every test exactly once
        if: steps.changes.outputs.run_suites != 'false'
        run: python .workflow-ci/scripts/ci/backend_shard_identities.py --full candidate/backend/backend-full-collected.txt --artifacts "$RUNNER_TEMP/backend-shard-artifacts" --shards ${{ env.BACKEND_SHARDS }}
      - name: Check the active factory fixtures
        if: steps.changes.outputs.run_suites != 'false'
        working-directory: candidate
        run: python scripts/factory-fixtures.py --check

  real-sudo:
    # The privileged regression for the cross-user terminal attach (#880). It uses real sudo with a
    # disposable user, so it runs only here, on an ephemeral hosted runner. This label ships the original
    # sudo that production uses, and the job attests the exact version before the test. The job is not
    # allowed to pass without running the test: no continue-on-error, no fallback, no extra condition.
    name: Hosted real-sudo attach
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/backend
      DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect a docs-only change
        id: changes
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/docs_only.py
      - uses: actions/setup-python@v7
        if: steps.changes.outputs.run_suites != 'false'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
        if: steps.changes.outputs.run_suites != 'false'
      - name: Attest the sudo of this runner
        if: steps.changes.outputs.run_suites != 'false'
        working-directory: backend
        run: python -m tests.real_sudo_support
      - name: Run the hosted real-sudo attach regression
        if: steps.changes.outputs.run_suites != 'false'
        working-directory: backend
        run: python -m pytest tests/test_cc_bridge_real_sudo.py -q --tb=short -rA
