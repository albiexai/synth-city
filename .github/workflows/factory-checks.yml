name: Factory source checks

on:
  pull_request:
    branches: [master, feature/software-delivery-product-reposition, release/v3.1, release/v4.0, release/v4.1, release/v4.2, release/v4.3, release/v4.4]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: factory-source-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  old_names:
    name: Rename old-name guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Reject unclassified old runtime names
        run: python scripts/ci/old_names.py
      - name: Docs changelog matches CHANGELOG.md
        run: python scripts/sync-docs-changelog.py --check
  python:
    name: Changed Python undefined names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the workflow's Python check driver
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-ci
          sparse-checkout: scripts/factory-static-check.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.14.10
      - name: Check changed Python files
        working-directory: candidate
        env:
          ACCEPTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: python ../.workflow-ci/scripts/factory-static-check.py --base "$ACCEPTED_BASE"
