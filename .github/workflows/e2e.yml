name: E2E

on:
  pull_request:
    branches: [master, release/v3.1, release/v4.0, release/v4.1, release/v4.2, release/v4.3, release/v4.4]
    types: [opened, synchronize, reopened]
  push:
    branches: [master, release/v3.1, release/v4.0, release/v4.1, release/v4.2, release/v4.3, release/v4.4]

permissions:
  contents: read
  pull-requests: read  # the docs-only detector lists the changed files

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-scope:
    name: E2E change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_suites: ${{ steps.changes.outputs.run_suites }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Detect a docs-only change
        id: changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/docs_only.py

  e2e-shards:
    name: E2E shard ${{ matrix.shard }} of ${{ strategy.job-total }}
    needs: e2e-scope
    if: needs.e2e-scope.outputs.run_suites == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the backend
        run: |
          python -m venv backend/venv
          backend/venv/bin/pip install -r backend/requirements.txt apscheduler
      - name: Install the frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Install tmux
        run: sudo apt-get install -y --no-install-recommends tmux
      - name: Type-check the journeys
        if: matrix.shard == 1
        working-directory: frontend
        run: npm run e2e:typecheck
      - name: Run the active journeys for this shard
        working-directory: frontend
        env:
          E2E_BACKEND_LOG: ${{ github.workspace }}/frontend/e2e-logs/backend.log
        run: npm run e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Upload the journey report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-journeys-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: frontend/test-results/results.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload traces, screenshots and the backend log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
            frontend/e2e-logs/
          retention-days: 7

  # Required check. It also succeeds when the detector confirms a docs-only change.
  e2e:
    name: e2e
    needs: [e2e-scope, e2e-shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require successful shards or a verified docs-only skip
        env:
          SCOPE_RESULT: ${{ needs.e2e-scope.result }}
          RUN_SUITES: ${{ needs.e2e-scope.outputs.run_suites }}
          SHARDS_RESULT: ${{ needs.e2e-shards.result }}
        run: |
          if [ "$SCOPE_RESULT" = success ]; then
            case "$RUN_SUITES:$SHARDS_RESULT" in
              true:success|false:skipped) exit 0 ;;
            esac
          fi
          printf 'E2E gate refused scope=%s run_suites=%s shards=%s\n' "$SCOPE_RESULT" "$RUN_SUITES" "$SHARDS_RESULT" >&2
          exit 1
      - uses: actions/checkout@v7
        if: needs.e2e-scope.outputs.run_suites == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: needs.e2e-scope.outputs.run_suites == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the Playwright collector
        if: needs.e2e-scope.outputs.run_suites == 'true'
        working-directory: frontend
        run: npm ci
      - uses: actions/download-artifact@v5
        if: needs.e2e-scope.outputs.run_suites == 'true'
        with:
          # A failed-jobs rerun can still use successful reports from earlier attempts of this run.
          pattern: e2e-journeys-*-attempt-*
          path: ${{ runner.temp }}/e2e-journey-artifacts
          merge-multiple: false
      - name: Prove that every active journey ran exactly once
        if: needs.e2e-scope.outputs.run_suites == 'true'
        run: |
          python3 scripts/ci/e2e_shard_identities.py --shards 4 \
            --output "$RUNNER_TEMP/e2e-manifest.json" \
            --artifacts "$RUNNER_TEMP/e2e-journey-artifacts"

  # Not required. Runs the @pending journeys and reports lane progress.
  e2e-pending:
    name: e2e-pending
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Detect a docs-only change
        id: changes
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/docs_only.py
      - uses: actions/setup-python@v7
        if: steps.changes.outputs.run_suites != 'false'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.run_suites != 'false'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the backend
        if: steps.changes.outputs.run_suites != 'false'
        run: |
          python -m venv backend/venv
          backend/venv/bin/pip install -r backend/requirements.txt apscheduler
      - name: Install the frontend and Chromium
        if: steps.changes.outputs.run_suites != 'false'
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Install tmux
        if: steps.changes.outputs.run_suites != 'false'
        run: sudo apt-get install -y --no-install-recommends tmux
      - name: Run the pending journeys
        if: steps.changes.outputs.run_suites != 'false'
        id: pending
        working-directory: frontend
        env:
          E2E_BACKEND_LOG: ${{ github.workspace }}/frontend/e2e-logs/backend.log
        run: npm run e2e:pending
        continue-on-error: true
      - name: Report progress
        if: steps.changes.outputs.run_suites != 'false' && (always())
        working-directory: frontend
        run: node e2e/support/report-progress.mjs test-results/results.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload traces and screenshots
        if: steps.changes.outputs.run_suites != 'false' && (steps.pending.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: e2e-pending-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
            frontend/e2e-logs/
          retention-days: 7

  # Not required. Repeats the route.fetch journey 20 times on the candidate head
  # of a pull request that changes the journey, its helper, the e2e instance or
  # this workflow (#916). The result is extra evidence: it is not in the list of
  # required jobs. A doubt about the changed files runs the loop.
  e2e-flicker-loop:
    name: e2e-flicker-loop
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      E2E_BACKEND_LOG: ${{ github.workspace }}/frontend/e2e-logs/backend.log
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Decide whether the loop applies
        id: loop
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if ! files="$(gh api --paginate "repos/$REPOSITORY/pulls/$PULL_NUMBER/files" --jq '.[].filename')"; then
            echo "Could not list the changed files; running the loop."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -Eq '^(frontend/e2e/g1/no-poll-flicker\.spec\.ts|frontend/e2e/g1/route-fetch\.spec\.ts|frontend/e2e/support/route-fetch\.ts|frontend/src/features/factory/reads\.ts|scripts/e2e-instance\.sh|\.github/workflows/e2e\.yml)$' <<< "$files"; then
            echo "A guarded file changed; running the loop."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No guarded file changed; the loop is not needed."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v7
        if: steps.loop.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        if: steps.loop.outputs.run == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the backend
        if: steps.loop.outputs.run == 'true'
        run: |
          python -m venv backend/venv
          backend/venv/bin/pip install -r backend/requirements.txt apscheduler
      - name: Install the frontend and Chromium
        if: steps.loop.outputs.run == 'true'
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Install tmux
        if: steps.loop.outputs.run == 'true'
        run: sudo apt-get install -y --no-install-recommends tmux
      - name: Repeat the route.fetch journey 20 times
        if: steps.loop.outputs.run == 'true'
        working-directory: frontend
        run: npx playwright test e2e/g1/no-poll-flicker.spec.ts --grep "Overview re-watches" --repeat-each=20
      - name: Require 20 plain passes
        if: steps.loop.outputs.run == 'true'
        working-directory: frontend
        run: |
          node -e '
            const s = JSON.parse(require("fs").readFileSync("test-results/results.json", "utf8")).stats
            const line = `expected=${s.expected} unexpected=${s.unexpected} flaky=${s.flaky} skipped=${s.skipped}`
            console.log(line)
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Flicker loop: ${line} (20 plain passes required)\n`)
            if (s.expected !== 20 || s.unexpected || s.flaky || s.skipped) process.exit(1)
          '
      - name: Upload the loop result and the backend log
        if: steps.loop.outputs.run == 'true' && (success())
        uses: actions/upload-artifact@v7
        with:
          name: e2e-flicker-loop-result
          path: |
            frontend/test-results/results.json
            frontend/e2e-logs/backend.log
          retention-days: 7
      - name: Upload traces, screenshots and the backend log
        if: steps.loop.outputs.run == 'true' && (failure())
        uses: actions/upload-artifact@v7
        with:
          name: e2e-flicker-loop-failure
          path: |
            frontend/test-results/
            frontend/playwright-report/
            frontend/e2e-logs/
          retention-days: 7
